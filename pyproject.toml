[tool.poetry]
name = "deep-scientific-researcher"
version = "0.1.0"
description = "Защищённая платформа для исследования технической литературы"
authors = ["Evgenii Vylegzhanin"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "^0.115"
uvicorn = {version = "^0.34", extras = ["standard"]}
pydantic-settings = "^2.8"
asyncpg = "^0.30"
qdrant-client = "^1.13"
httpx = "^0.28"
langgraph = ">=1.0,<2.0"
langchain-openai = ">=1.0,<2.0"
argon2-cffi = "^23.1"
python-multipart = "^0.0.20"
pypdf = "^5.4"
trafilatura = "^2.0"
feedparser = "^6.0"
sentence-transformers = "^4.0"
prometheus-client = "^0.21"
opentelemetry-api = "^1.31"
opentelemetry-sdk = "^1.31"
opentelemetry-exporter-otlp = "^1.31"
docling = {version = "^2.30", optional = true}
langgraph-checkpoint-postgres = "^3.1.2"
psycopg = {version = ">=3.3,<4", extras = ["binary"]}
reportlab = ">=4.2,<5"
matplotlib = ">=3.9,<4"
markdown-it-py = ">=3,<5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.26"
ruff = "^0.11"
respx = "^0.22"

[tool.poetry.extras]
ocr = ["docling"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=1.8"]
build-backend = "poetry.core.masonry.api"
