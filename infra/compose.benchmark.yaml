name: research-benchmark
x-app: &app
  image: ${BENCHMARK_BACKEND_IMAGE:-research-backend:submission}
  env_file: ../.env.benchmark
  environment: &app-env
    APP_MODE: airgap
    DATABASE_URL: postgresql://research:${POSTGRES_PASSWORD:?required}@postgres:5432/research
    QDRANT_URL: http://qdrant:6333
    MODEL_BASE_URL: http://model:8000/v1
    VISION_BASE_URL: http://model:8000/v1
    TEXT_MODEL: research-text
    VISION_MODEL: research-text
    EMBEDDING_MODEL: /models/embedding
    RERANK_MODEL: /models/reranker
    DOCLING_ARTIFACTS_PATH: /models/docling
    PDF_PARSER: docling
    FILE_ROOT: /data/files
    FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://localhost:8443}
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    HF_HUB_DISABLE_TELEMETRY: "1"
    OMP_NUM_THREADS: "4"
    GRAPH_RETRIEVAL_ENABLED: ${GRAPH_RETRIEVAL_ENABLED:-false}
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
  volumes:
    - documents:/data/files
    - ${MODEL_ARTIFACTS_DIR:?required}:/models:ro
  restart: unless-stopped
services:
  model:
    restart: unless-stopped
    image: vllm/vllm-openai@sha256:8a69ffad015f138d7170c4ddc429e230a3bc1c1719f67e14324749df200a4b90
    ipc: host
    environment:
      VLLM_API_KEY: ${MODEL_API_KEY:?required}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - ${MODEL_ARTIFACTS_DIR:?required}:/models:ro
      - inference_cache:/root/.cache
    command: ["--model", "/models/generation", "--served-model-name", "research-text", "--max-model-len", "8192", "--gpu-memory-utilization", "0.90", "--enable-prefix-caching", "--default-chat-template-kwargs", '{"enable_thinking":false}', "--host", "0.0.0.0"]
    ports: ["127.0.0.1:8001:8000"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: research
      POSTGRES_USER: research
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research"]
      interval: 5s
      timeout: 3s
      retries: 20
  qdrant:
    restart: unless-stopped
    image: qdrant/qdrant:v1.19.1
    volumes: ["qdrant:/qdrant/storage"]
  api:
    <<: *app
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_started}
  worker:
    <<: *app
    command: ["python", "-m", "backend.worker"]
  frontend:
    restart: unless-stopped
    image: ${BENCHMARK_FRONTEND_IMAGE:-research-frontend:submission}
    ports: ["127.0.0.1:8443:443"]
    volumes:
      - ./nginx.benchmark.conf:/etc/nginx/conf.d/default.conf:ro
      - ${BENCHMARK_CERT_DIR:?required}:/etc/nginx/certs:ro
  jaeger:
    restart: unless-stopped
    image: jaegertracing/all-in-one:1.68.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["127.0.0.1:16686:16686"]
volumes:
  postgres:
  qdrant:
  documents:
  inference_cache:
networks:
  default:
    internal: ${BENCHMARK_NETWORK_INTERNAL:-false}
